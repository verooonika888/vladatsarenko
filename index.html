<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVOLUTION | Владислава Царенко</title>
    
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Шрифты (Montserrat + Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Библиотека для телефона (Intl Tel Input) CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/css/intlTelInput.css">

    <!-- FACEBOOK PIXEL -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        evo: {
                            bg: '#050505',      /* Глубокий черный фон */
                            card: '#0F0F0F',    /* Цвет карточек */
                            red: '#FF2E2E',     /* Яркий красный акцент из презентации */
                            text: '#E5E5E5',    /* Светло-серый текст */
                            gray: '#2A2A2A'     /* Границы */
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Montserrat', 'sans-serif'],
                    },
                    backgroundImage: {
                        'red-gradient': 'linear-gradient(135deg, #FF2E2E 0%, #990000 100%)',
                        'glow': 'radial-gradient(circle, rgba(255,46,46,0.15) 0%, rgba(5,5,5,0) 70%)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #E5E5E5;
        }

        /* Эффект свечения */
        .red-glow-spot {
            position: absolute;
            width: 400px;
            height: 400px;
            background: #FF2E2E;
            filter: blur(150px);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        /* Стеклянные карточки */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Modal Overlay */
        #modal-overlay, #image-modal-overlay {
            backdrop-filter: blur(8px);
        }

        /* Декоративные звезды */
        .sparkle {
            position: absolute;
            color: #FF2E2E;
            opacity: 0.8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Анимации появления */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* БЕГУЩАЯ СТРОКА (MARQUEE) */
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 60s linear infinite; /* Скорость ленты */
        }
        
        /* Останавливать при наведении */
        .animate-marquee:hover {
            animation-play-state: paused;
        }

        /* Стили фото кейсов: НАТУРАЛЬНЫЕ ПРОПОРЦИИ */
        .case-img-container {
            /* Высота на ПК: 400px (крупно) */
            height: 400px; 
            width: auto;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            cursor: pointer; /* Курсор-рука */
            
            /* На мобильных высоту делаем 250px */
            @media (max-width: 640px) {
                height: 250px;
            }
        }
        
        .case-img-container img {
            height: 100%;
            width: auto; 
            object-fit: contain; 
            display: block;
        }

        /* Стили инпутов */
        .evo-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            transition: all 0.3s;
            width: 100%;
        }
        .evo-input:focus {
            border-color: #FF2E2E;
            background: rgba(255, 255, 255, 0.08);
            outline: none;
            box-shadow: 0 0 15px rgba(255, 46, 46, 0.2);
        }
        .evo-input.error-border {
            border-color: #ff2e2e;
            box-shadow: 0 0 10px rgba(255, 46, 46, 0.5);
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Кастомизация Intl Tel Input под темную тему */
        .iti { width: 100%; }
        .iti__flag-container { border-radius: 8px 0 0 8px; }
        .iti__country-list {
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
        }
        .iti__country { border-bottom: 1px solid #333; }
        /* Цвет текста в инпуте телефона */
        #phone {
            padding-left: 50px !important; /* Отступ для флага */
        }
    </style>
</head>

                    </div>
